[workspace]
members = ["crates/*"]

[package]
name = "lsf-music"
version = "0.1.0"
edition = "2024"

[features]
default = ["opus"]
opus = ["lcc-transcode/opus"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
lcc-transcode = { path = "crates/lcc-transcode", default-features = false }
log = "0.4.35"
