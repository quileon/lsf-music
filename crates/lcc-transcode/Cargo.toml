[package]
name = "lcc-transcode"
version = "0.1.0"
edition = "2024"

[features]
opus = ["dep:opusenc"]

[dependencies]
anyhow = "1"
log = "0.4.35"
opusenc = { version = "0.3.1", features = ["encoder-options"], optional = true }
symphonia = { version = "0.6.1", default-features = false, features = [
	"flac",
	"alac",
	"isomp4",
] }
walkdir = "2.5.0"
